[project]
name = "pixelmend-engine"
version = "0.1.0"
description = "Local image processing sidecar for PixelMend"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "filelock>=3.32,<4",
    "fastapi>=0.115,<1",
    "huggingface-hub>=1.28,<2",
    "httpx>=0.28,<1",
    "numpy>=2.5,<3",
    "pillow>=12.3,<13",
    "platformdirs>=4,<5",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelmend_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
