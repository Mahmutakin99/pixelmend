[project]
name = "pixelmend-engine"
version = "0.1.0"
description = "Local image processing sidecar for PixelMend"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "platformdirs>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelmend_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
