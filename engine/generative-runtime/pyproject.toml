[project]
name = "pixelmend-generative-runtime"
version = "0.1.0"
description = "Isolated local generative runtime for PixelMend on Apple Silicon"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mflux==0.21.0",
    "mlx==0.32.2",
    "mlx-lm==0.32.0",
]

[dependency-groups]
dev = ["pyinstaller==6.22.3"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
