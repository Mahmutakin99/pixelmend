name: Özellik önerisi / Feature request
description: Bir iş akışını iyileştirecek fikri paylaşın / Suggest an improvement
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: İhtiyaç / Need
      description: Hangi işi yapmaya çalışıyorsunuz? / What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Öneri / Proposal
      description: Beklediğiniz davranışı ve varsa alternatifleri açıklayın. / Describe the behavior and any alternatives.
    validations:
      required: true
